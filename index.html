<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site desativado</title>
<style>
  :root{ --bg:#f5f1e8; --ink:#1d1912; --muted:#6f6758; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#17140f; --ink:#f3eee2; --muted:#a59d8c; } }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main{ max-width:560px; margin:18vh auto 0; padding:0 16px; }
  h1{ font-size:24px; margin:0 0 10px; }
  p{ color:var(--muted); line-height:1.5; margin:0; }
</style>
</head>
<body>
<main>
  <h1>Site desativado</h1>
  <p>A apresentação do encontro de contas Tríade × Enpavi foi desativada em 04/11/2026.</p>
</main>
</body>
</html>
